name = "veille"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Servir les assets statiques avec routing vers le Worker
[assets]
directory = "../site"
binding = "ASSETS"

# Base de données D1
[[d1_databases]]
binding = "DB"
database_name = "veille-db"
database_id = "TO_BE_REPLACED"

# Variables d'environnement (à configurer dans le dashboard ou avec wrangler secret)
# ANTHROPIC_API_KEY = "sk-ant-..."

[vars]
ENVIRONMENT = "production"
